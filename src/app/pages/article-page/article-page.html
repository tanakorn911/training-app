<div class="flex w-full">
  <div class="fixed inset-0 flex justify-center sm:px-8">
    <div class="flex w-full max-w-7xl lg:px-8">
      <div
        class="w-full bg-white ring-1 ring-zinc-100 dark:bg-zinc-900 dark:ring-zinc-300/20">
      </div>
    </div>
  </div>
  <div class="relative flex w-full flex-col">
    <div class="w-full flex items-center justify-center pt-6">
      <app-segmented-nav-component />
    </div>

    <main class="flex-auto">
      <div class="mx-auto w-full max-w-7xl lg:px-8">
        <div class="relative px-4 sm:px-8 lg:px-12">
          <div class="mx-auto mt-8 lg:grid lg:grid-cols-12 lg:gap-x-8 lg:py-12">
            <!-- Left Column: Review Summary -->
            <div class="lg:col-span-5">
              <div
                class="bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg p-6 shadow-sm"
              >
                <app-review-summary-component [reviews]="reviews()" />
              </div>

              <!-- Share Feedback Section -->
              <div class="mt-8">
                <div
                  class="bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg p-6 shadow-sm"
                >
                  <app-write-review-component (reviewSubmitted)="loadReviews()" />
                </div>
              </div>
            </div>

            <!-- Right Column: Review List -->
            <div class="mt-16 lg:col-span-6 lg:col-start-7 lg:mt-0">
              <div
                class="bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg p-6 shadow-sm"
              >
                <div class="max-h-[750px] overflow-y-auto pr-2">
                  <div class="divide-y divide-gray-200">
                    @if (isLoading()) {
                    <div class="py-12 text-center text-gray-500">Loading reviews...</div>
                    } @else if (reviews().length === 0) {
                    <div class="py-12 text-center text-gray-500">
                      No reviews yet. Be the first to share your feedback!
                    </div>
                    } @else { @for (review of reviews(); track review.username + review.comment) {
                    <app-review-item-component [review]="review" />
                    } }
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <app-footer-component />
  </div>
</div>
